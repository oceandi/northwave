<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Northwavé</title>
<meta name="description" content="Game engine sound shell. A tree of named sound requests, recorded by a person, shipped as a kit to the engine you already use." />
<style>
  :root {
    --ground: #121214;
    --surface: #191920;
    --line: #2a2a30;
    --bone: #e9e5db;
    --muted: #8f8a7e;
    --wave: #7fa9d9;
    --wave-deep: #45719c;
    --gold: #b99755;
    --serif: "Iowan Old Style", Palatino, "Palatino Linotype", "Book Antiqua", Georgia, serif;
    --mono: "SF Mono", Menlo, Consolas, "Courier New", monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  body {
    background: var(--ground);
    color: var(--bone);
    font-family: var(--serif);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--wave); text-decoration: none; }
  a:hover { text-decoration: underline; text-underline-offset: 3px; }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--wave); outline-offset: 3px; border-radius: 2px; }

  .shell { max-width: 1020px; margin: 0 auto; padding: 0 24px; }

  /* ---------- hero ---------- */
  header { padding: 9vh 0 0; }
  .brand {
    font-family: var(--mono);
    font-size: 0.78rem;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .brand b { color: var(--wave); font-weight: 500; }
  h1 {
    margin-top: 5vh;
    font-size: clamp(2.4rem, 6vw, 4.4rem);
    line-height: 1.08;
    font-weight: 400;
    letter-spacing: 0.005em;
    max-width: 17ch;
    text-wrap: balance;
  }
  h1 em { font-style: italic; color: var(--wave); }
  .lede {
    margin-top: 1.6rem;
    max-width: 58ch;
    font-size: 1.08rem;
    color: var(--muted);
  }
  .lede b { color: var(--bone); font-weight: 500; }

  /* ---------- the listening stone ---------- */
  .listen {
    margin: 7vh 0 0;
    border: 1px solid var(--line);
    background: var(--surface);
    border-radius: 10px;
    padding: 28px;
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 26px;
    align-items: center;
  }
  .medallion {
    width: 84px; height: 84px;
    border-radius: 50%;
    border: 1px solid var(--gold);
    background: radial-gradient(circle at 35% 30%, #23232b, #121216 70%);
    color: var(--bone);
    cursor: pointer;
    display: grid; place-items: center;
    transition: border-color .25s, box-shadow .25s;
  }
  .medallion:hover { border-color: var(--wave); box-shadow: 0 0 32px rgba(127,169,217,.18); }
  .medallion svg { width: 26px; height: 26px; fill: var(--bone); }
  .listen .placard { min-width: 0; }
  canvas#wave {
    display: block;
    width: 100%; height: 64px;
    margin-bottom: 14px;
  }
  .placard-title { font-size: 1.05rem; letter-spacing: 0.01em; }
  .placard-meta {
    margin-top: 6px;
    font-family: var(--mono);
    font-size: 0.74rem;
    letter-spacing: 0.06em;
    color: var(--muted);
  }
  .placard-meta i { font-style: normal; color: var(--wave); }

  /* ---------- section frame ---------- */
  section { padding: 11vh 0 0; }
  .eyebrow {
    font-family: var(--mono);
    font-size: 0.72rem;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: var(--gold);
  }
  h2 {
    margin-top: 0.9rem;
    font-size: clamp(1.5rem, 3.2vw, 2.1rem);
    font-weight: 400;
    letter-spacing: 0.01em;
  }
  .sub { margin-top: .8rem; max-width: 62ch; color: var(--muted); }
  .sub b { color: var(--bone); font-weight: 500; }

  /* ---------- the canto ---------- */
  .canto {
    margin-top: 9vh;
    padding: 9vh 24px;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    text-align: center;
  }
  .canto p {
    font-size: clamp(1.25rem, 2.6vw, 1.75rem);
    font-style: italic;
    line-height: 1.75;
    max-width: 34ch;
    margin: 0 auto;
    text-wrap: balance;
    color: var(--bone);
  }
  .canto p + p { margin-top: 2.6em; }
  .canto .hush { color: var(--muted); }
  .canto .being { color: var(--wave); }
  .canto .credit {
    margin-top: 1.8em;
    font-style: normal;
    font-size: 0.88rem;
    color: var(--muted);
  }
  .canto .credit a { color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
  .canto .credit a:hover { color: var(--wave); }
  .canto .seal {
    margin-top: 3.2em;
    font-family: var(--mono);
    font-style: normal;
    font-size: 0.72rem;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: var(--gold);
  }

  /* ---------- the three chambers ---------- */
  .chambers { margin-top: 40px; display: grid; gap: 14px; }
  .chamber {
    border: 1px solid var(--line);
    border-left: 3px solid var(--wave-deep);
    background: var(--surface);
    border-radius: 8px;
    padding: 22px 24px;
    display: grid;
    grid-template-columns: 110px 1fr;
    gap: 20px;
    align-items: baseline;
  }
  @media (max-width: 640px) { .chamber { grid-template-columns: 1fr; gap: 6px; } }
  .chamber .name {
    font-family: var(--mono);
    font-size: 1rem;
    letter-spacing: 0.14em;
    color: var(--wave);
  }
  .chamber p { color: var(--muted); font-size: 0.97rem; }
  .chamber p b { color: var(--bone); font-weight: 500; }
  .chamber code {
    font-family: var(--mono);
    font-size: 0.85em;
    color: var(--bone);
    background: #22222a;
    padding: 0.1em 0.4em;
    border-radius: 4px;
  }

  /* ---------- store & footer ---------- */
  .store {
    margin-top: 11vh;
    border-top: 1px solid var(--line);
    padding: 7vh 0 2vh;
    text-align: center;
  }
  .store .big {
    font-size: clamp(1.3rem, 2.6vw, 1.7rem);
    font-style: italic;
  }
  .store .cta {
    display: inline-block;
    margin-top: 26px;
    font-family: var(--mono);
    font-size: 0.85rem;
    letter-spacing: 0.12em;
    color: var(--bone);
    border: 1px solid var(--gold);
    border-radius: 999px;
    padding: 13px 30px;
    transition: border-color .25s, box-shadow .25s;
  }
  .store .cta:hover { text-decoration: none; border-color: var(--wave); box-shadow: 0 0 32px rgba(127,169,217,.15); }
  .store .note { margin-top: 12px; font-size: .85rem; color: var(--muted); }
  footer {
    padding: 6vh 0 8vh;
    text-align: center;
    color: var(--muted);
    font-size: 0.85rem;
  }
  footer .rule { color: var(--gold); opacity: .6; padding: 0 .6em; }
</style>
</head>
<body>

<div class="shell">
  <header>
    <div class="brand">NORTH<b>WAVE</b> · MEDIA TABLE CLOCK</div>
    <h1>Quanto più l’opera è perfetta, <em>tanto meno sembra essere frutto di fatica.</em></h1>

  <div class="store">
    <div class="big">Download GUI</div>
    <a class="cta" href="https://apps.apple.com/app/id6803100836">App Store</a>
  </div>

  <footer>
    <a href="guide.html">The Walk</a><span class="rule">·</span>
    <a href="privacy.html">Privacy</a><span class="rule">·</span>
    <a href="mailto:korkmaz.x7@gmail.com">Contact</a><span class="rule">·</span>
    © 2026 Lonestar Games
  </footer>
</div>


</body>
</html>
